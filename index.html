<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Thailand Only</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #status-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 400px;
        }

        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
            display: none;
            width: 100%;
        }

        model-viewer {
            width: 100%;
            height: 400px;
            display: none;
        }
    </style>
</head>

<body>

    <div id="status-box">
        <h3>📍 ตรวจสอบตำแหน่งของคุณ</h3>
        <p id="message">กำลังตรวจสอบ GPS...</p>

        <button id="ar-btn" class="btn" onclick="openAR()">กดเพื่อวางโมเดล AR</button>
    </div>

    <model-viewer id="my-model" src="./AR_MOVE.glb" ios-src="./AR_Move2.usdz" ar
        ar-modes="webxr scene-viewer quick-look" camera-controls autoplay shadow-intensity="1">
    </model-viewer>

    <script>
        const messageEl = document.getElementById('message');
        const arBtn = document.getElementById('ar-btn');

        // เริ่มทำงานหลังโหลดหน้า
        window.onload = () => {

            if (!navigator.geolocation) {
                messageEl.innerHTML = "❌ อุปกรณ์ไม่รองรับ GPS";
                return;
            }

            navigator.geolocation.getCurrentPosition((position) => {
                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;

                // 🇹🇭 ขอบเขตประเทศไทย
                const isInThailand =
                    userLat >= 5.5 && userLat <= 20.5 &&
                    userLng >= 97.0 && userLng <= 105.5;

                if (isInThailand) {
                    messageEl.innerHTML = `✅ คุณอยู่ในประเทศไทย<br>สามารถใช้งาน AR ได้`;
                    arBtn.style.display = 'block';
                } else {
                    messageEl.innerHTML = `❌ ระบบนี้ใช้ได้เฉพาะในประเทศไทย`;
                }

            }, (error) => {
                messageEl.innerHTML = "⚠️ กรุณาอนุญาตให้เข้าถึง GPS";
            });
        };

        function openAR() {
            const modelViewer = document.getElementById('my-model');
            modelViewer.activateAR();
        }
    </script>

</body>

</html>

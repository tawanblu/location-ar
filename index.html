<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goodness AR - Location Based</title>
  <!-- Model Viewer สำหรับ AR ทั้ง iOS/Android -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Kanit', sans-serif;
      background: #eef2f3;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #status-box {
      background: white;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      width: 85%;
      max-width: 400px;
      z-index: 10;
    }

    .btn {
      background: linear-gradient(135deg, #007bff, #0056b3);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 18px;
      margin-top: 20px;
      cursor: pointer;
      display: none;
      width: 100%;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .distance-info {
      font-size: 24px;
      font-weight: bold;
      color: #007bff;
      margin: 10px 0;
    }

    #message {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    model-viewer {
      display: none;
    }

    /* ซ่อนตัวอย่าง 3D ในหน้าเว็บ */
  </style>
</head>

<body>

  <div id="status-box">
    <h2 style="margin-top:0;">🌟 Goodness AR</h2>
    <p id="message">กำลังเข้าถึงระบบ GPS...</p>
    <div id="distance-display" class="distance-info">-- ม.</div>
    <button id="ar-btn" class="btn" onclick="openAR()">✨ วางรางวัลความดี (AR)</button>
  </div>

  <!-- โมเดลความดี (เปลี่ยน src เป็นไฟล์ของคุณเองได้) -->
  <model-viewer id="my-model" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
    ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz" ar ar-modes="webxr scene-viewer quick-look"
    camera-controls touch-action="pan-y">
  </model-viewer>

  <script>
    const messageEl = document.getElementById('message');
    const distanceEl = document.getElementById('distance-display');
    const arBtn = document.getElementById('ar-btn');

    // 🎯 1. ตั้งค่าพิกัดจุดทำความดี (ตัวอย่าง: หน้าเสาธง/ห้องสมุด)
    const TARGET_LAT = 13.7563; // แก้เป็นพิกัดจริงของคุณ
    const TARGET_LNG = 100.5018;
    const ACTIVATION_RADIUS = 30; // รัศมี 30 เมตร

    // ฟังก์ชันคำนวณระยะทาง (Haversine Formula)
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // 📡 2. ติดตามตำแหน่งแบบ Real-time (WatchPosition)
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (position) => {
          const {
            latitude,
            longitude,
            accuracy
          } = position.coords;
          const distance = calculateDistance(latitude, longitude, TARGET_LAT, TARGET_LNG);

          distanceEl.innerText = `${Math.round(distance)} ม.`;

          if (distance <= ACTIVATION_RADIUS) {
            messageEl.innerHTML = "<span style='color:green'><b>✅ ถึงจุดทำความดีแล้ว!</b><br>กดปุ่มด้านล่างเพื่อรับรางวัล AR</span>";
            arBtn.style.display = 'block';
          } else {
            messageEl.innerHTML = `📍 เดินเข้าใกล้จุดหมายอีกนิด<br><small>(ความแม่นยำ GPS: ${Math.round(accuracy)} ม.)</small>`;
            arBtn.style.display = 'none';
          }
        },
        (error) => {
          messageEl.innerHTML = "⚠️ กรุณาเปิด GPS และอนุญาตสิทธิ์ใน Browser";
          console.error(error);
        }, {
          enableHighAccuracy: true,
          maximumAge: 0
        }
      );
    } else {
      messageEl.innerHTML = "❌ อุปกรณ์ไม่รองรับระบบระบุตำแหน่ง";
    }

    // 📱 3. ฟังก์ชันเปิด AR สำหรับทั้งสองระบบ
    function openAR() {
      const modelViewer = document.getElementById('my-model');
      // ตรวจสอบว่า Browser รองรับ AR หรือไม่
      if (modelViewer.canActivateAR) {
        modelViewer.activateAR();
      } else {
        // กรณี iOS รุ่นเก่าหรือไม่รองรับ WebXR/QuickLook
        alert("ขออภัย อุปกรณ์ของคุณอาจไม่รองรับ AR หรือต้องเปิดผ่าน Safari/Chrome ล่าสุด");
      }
    }
  </script>
</body>

</html>

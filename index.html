<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Experience</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .card {
            width: 90%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        p {
            font-size: 14px;
            opacity: 0.8;
        }

        #status {
            margin-top: 15px;
            font-size: 16px;
        }

        #arButtonContainer {
            display: none;
            margin-top: 25px;
        }

        .ar-btn {
            display: inline-block;
            padding: 14px 25px;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            font-size: 16px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
            transition: 0.3s;
        }

        .ar-btn:hover {
            transform: scale(1.05);
        }

        .pulse {
            margin-top: 20px;
            width: 15px;
            height: 15px;
            background: #00ffcc;
            border-radius: 50%;
            margin-left: auto;
            margin-right: auto;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            70% {
                transform: scale(2);
                opacity: 0;
            }

            100% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <h1><i class="fa-solid fa-location-dot"></i> AR Experience</h1>
        <p>กดปุ่มเพื่อเปิด AR ได้ทันที</p>

        <div id="status">กำลังตรวจสอบ GPS...</div>

        <div class="pulse"></div>

        <div id="arButtonContainer">
            <button id="arBtn" class="ar-btn">
                <i class="fa-solid fa-cube"></i> เปิด AR
            </button>
        </div>
    </div>

    <script>
        const statusText = document.getElementById("status");
        const arButtonContainer = document.getElementById("arButtonContainer");
        const arBtn = document.getElementById("arBtn");

        // 🔗 โมเดล (เปลี่ยนเป็นของคุณได้)
        const iosModelUrl = "https://modelviewer.dev/shared-assets/models/Astronaut.usdz";
        const androidModelUrl = "https://modelviewer.dev/shared-assets/models/Astronaut.glb";

        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const isAndroid = /Android/.test(navigator.userAgent);

        // 📍 เช็คว่าอยู่ในประเทศไทย
        function isInThailand(lat, lng) {
            return lat >= 5.5 && lat <= 20.5 &&
                lng >= 97.0 && lng <= 105.5;
        }

        function checkLocation(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            if (isInThailand(lat, lng)) {
                statusText.innerHTML = "✅ คุณอยู่ในประเทศไทย";
                arButtonContainer.style.display = "block";
            } else {
                statusText.innerHTML = "❌ ใช้งานได้เฉพาะในประเทศไทย";
            }
        }

        function error() {
            statusText.innerHTML = "⚠️ กรุณาเปิด GPS";
        }

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(checkLocation, error);
        } else {
            statusText.innerHTML = "❌ อุปกรณ์ไม่รองรับ GPS";
        }

        // 🚀 กดแล้วเข้า AR ทันที
        arBtn.addEventListener("click", function () {

            if (isIOS) {
                const a = document.createElement("a");
                a.setAttribute("rel", "ar");
                a.setAttribute("href", iosModelUrl);
                a.click();

            } else if (isAndroid) {
                const intent = `intent://arvr.google.com/scene-viewer/1.0?file=${androidModelUrl}&mode=ar_only#Intent;scheme=https;package=com.google.ar.core;end;`;
                window.location.href = intent;

            } else {
                alert("ใช้ได้เฉพาะมือถือเท่านั้น");
            }

        });
    </script>

</body>

</html>

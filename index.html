<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Location-Based WebAR</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  
  <script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js'></script>
  
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

  <style>
    /* ตัวอย่าง UI เรียบง่าย */
    .ui-layer {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 100;
      pointer-events: none; /* ให้คลิกทะลุไปโดน AR ได้ */
    }
    .instruction-box {
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-family: sans-serif;
      display: inline-block;
    }
  </style>
</head>

<body style="margin: 0; overflow: hidden;">

  <div class="ui-layer">
    <div class="instruction-box">หันกล้องไปรอบๆ เพื่อค้นหาโมเดล</div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
    renderer="antialias: true; alpha: true">

    <a-assets>
      <a-asset-item id="my-animated-model" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Fox/glTF-Binary/Fox.glb"></a-asset-item>
    </a-assets>

    <a-camera gps-camera rotation-reader></a-camera>

    <a-entity
      gltf-model="#my-animated-model"
      gps-entity-place="latitude: 13.756331; longitude: 100.501765;" scale="0.5 0.5 0.5" animation-mixer="loop: repeat" look-at="[gps-camera]" >
    </a-entity>

  </a-scene>
</body>
</html>

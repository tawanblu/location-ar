<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ganesha AR — อัญเชิญองค์พิฆเนศ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/DonMcCurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script>

    <style>
        :root { --gold: #d4a843; --gold-light: #f0c96b; --deep: #1a0a00; }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Sarabun', sans-serif; overflow: hidden; background-color: #000; margin: 0; }

        /* === UI เมนูหลัก === */
        #main-menu-ui { position: absolute; inset: 0; z-index: 999; background: var(--deep); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
        #main-menu-ui.hide { opacity: 0; pointer-events: none; }
        #close-ar-btn { position: fixed; top: 20px; left: 20px; z-index: 1000; background: rgba(26, 10, 0, 0.8); border: 1px solid var(--gold); color: var(--gold-light); padding: 10px 20px; border-radius: 50px; font-family: 'Sarabun', sans-serif; font-weight: 600; display: none; cursor: pointer; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); }
        
        #ar-controls { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000; display: none; flex-wrap: wrap; justify-content: center; width: 90%; gap: 10px; }
        .control-btn { background: rgba(26, 10, 0, 0.85); border: 1px solid var(--gold); color: var(--gold-light); padding: 10px 18px; border-radius: 12px; font-family: 'Sarabun', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--gold-light); }
        .control-btn:active { background: var(--gold); color: var(--deep); transform: scale(0.95); }

        #ar-hint { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(212, 168, 67, 0.4); color: var(--gold-light); padding: 8px 16px; border-radius: 20px; font-family: 'Sarabun', sans-serif; font-size: 13px; white-space: nowrap; display: none; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }

        .bg-gradient { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(196, 64, 10, 0.25) 0%, transparent 70%), linear-gradient(180deg, #0d0400 0%, #1a0800 50%, #0d0200 100%); z-index: 0; }
        .particles { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
        .particle { position: absolute; border-radius: 50%; background: radial-gradient(circle, var(--gold-light), transparent 70%); animation: float-up linear infinite; opacity: 0; }
        @keyframes float-up { 0% { transform: translateY(100vh) translateX(0) scale(0.5); opacity: 0; } 10% { opacity: 0.6; } 90% { opacity: 0.2; } 100% { transform: translateY(-10vh) translateX(30px) scale(1); opacity: 0; } }
        
        .card { position: relative; z-index: 10; width: min(90vw, 400px); display: flex; flex-direction: column; align-items: center; text-align: center; }
        .card-inner { background: linear-gradient(170deg, #1e0c00 0%, #160800 40%, #0f0400 100%); border: 1px solid rgba(212, 168, 67, 0.35); border-radius: 28px; padding: 40px 30px 36px; box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8); width: 100%; }
        .deity-icon { color: whitesmoke; font-size: 52px; margin-bottom: 6px; display: block; }
        .title-main { font-family: 'Cinzel Decorative', serif; font-size: 26px; font-weight: 900; color: var(--gold-light); }
        .description { font-size: 15px; color: rgba(253, 240, 208, 0.7); line-height: 1.8; margin: 20px 0; }
        .btn { padding: 18px 24px; background: linear-gradient(135deg, #c4400a, #7a1a0a); border: 1px solid var(--gold); border-radius: 16px; color: var(--gold-light); font-weight: 600; cursor: pointer; width: 100%; }
        
        /* ซ่อนวิดีโอตัวเล็กของ AR.js */
        .arjs-loader { display: none !important; }
    </style>
</head>

<body>

    <audio id="narration-audio" src="demovoice.mp3" preload="auto"></audio>

    <div id="main-menu-ui">
        <div class="bg-gradient"></div>
        <div class="particles" id="particles"></div>
        <div class="card">
            <div class="card-inner">
                <span class="deity-icon">ॐ</span>
                <div class="title-main">Ganesha AR</div>
                <p class="description">
                    อัญเชิญพระพิฆเนศผ่าน WebAR<br>
                    สแกนป้ายเพื่อรับพรและคำบรรยาย<br>
                    (โปรดอนุญาตการใช้กล้องและเปิดเสียง)
                </p>
                <button class="btn" onclick="startAR()">✦ สแกนป้ายสัญลักษณ์ (AR)</button>
            </div>
        </div>
    </div>

    <button id="close-ar-btn" onclick="stopAR()">❮ ปิดกล้อง</button>
    <div id="ar-hint">💡 ใช้นิ้วปัดหมุน หรือถ่างนิ้วย่อ-ขยายโมเดล</div>

    <div id="ar-controls">
        <button class="control-btn" onclick="rotateModel(-30)">↺ ซ้าย</button>
        <button class="control-btn" onclick="rotateModel(30)">ขวา ↻</button>
        <button class="control-btn" id="audio-btn" onclick="toggleAudio()" style="background: rgba(122, 26, 10, 0.85);">🔇 เสียง</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; displayWidth: 1280; displayHeight: 720;" vr-mode-ui="enabled: false" gesture-detector>
        
        <a-assets>
            <a-asset-item id="ganesha-model" src="model/AR_MOVE4.glb"></a-asset-item>
        </a-assets>

        <a-marker preset="hiro" raycaster="objects: .clickable" emitevents="true" cursor="fuse: false; rayOrigin: mouse;" id="markerA">
            <a-entity id="ganesha-entity" 
                      gltf-model="#ganesha-model" 
                      scale="1 1 1" 
                      position="0 0 0" 
                      rotation="0 -90 90"
                      class="clickable" 
                      gesture-handler="minScale: 0.1; maxScale: 5" 
                      animation-mixer>
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // Particles Effect
        const particleContainer = document.getElementById('particles');
        for (let i = 0; i < 22; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 5 + 2;
            p.style.cssText = `width: ${size}px; height: ${size}px; left: ${Math.random() * 100}%; animation-duration: ${Math.random() * 12 + 8}s; animation-delay: ${Math.random() * -20}s;`;
            particleContainer.appendChild(p);
        }

        const audio = document.getElementById('narration-audio');
        const audioBtn = document.getElementById('audio-btn');
        const marker = document.getElementById('markerA');

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                audioBtn.innerHTML = '🔊 เสียง';
            } else {
                audio.pause();
                audioBtn.innerHTML = '🔇 เสียง';
            }
        }

        marker.addEventListener('markerFound', () => {
            audio.play().then(() => audioBtn.innerHTML = '🔊 เสียง').catch(e => console.log("Audio blocked"));
        });

        marker.addEventListener('markerLost', () => {
            audio.pause();
            audioBtn.innerHTML = '🔇 เสียง';
        });

        function startAR() {
            document.getElementById('main-menu-ui').classList.add('hide');
            document.getElementById('close-ar-btn').style.display = 'block';
            document.getElementById('ar-controls').style.display = 'flex';
            document.getElementById('ar-hint').style.display = 'block'; 
            
            // 🌟 สำคัญ: กระตุ้นให้กล้องทำงานบนมือถือ 🌟
            window.dispatchEvent(new Event('resize'));
        }

        function stopAR() {
            // คืนทรัพยากรกล้องด้วยการรีโหลดหน้า
            window.location.reload();
        }

        function rotateModel(deg) {
            const model = document.getElementById('ganesha-entity');
            const rot = model.getAttribute('rotation');
            model.setAttribute('rotation', { x: rot.x, y: rot.y + deg, z: rot.z });
        }
    </script>
</body>

</html>

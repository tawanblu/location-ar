<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Geofence + Tap to Place</title>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #status-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 400px;
        }

        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
            display: none;
            width: 100%;
        }

        .btn:active {
            background: #0056b3;
        }

        /* ซ่อนตัว model-viewer ไว้ก่อน จนกว่าจะกดปุ่ม AR */
        model-viewer {
            width: 100%;
            height: 400px;
            display: none;
        }
    </style>
</head>

<body>

    <div id="status-box">
        <h3>📍 ตรวจสอบตำแหน่งของคุณ</h3>
        <p id="message">กำลังค้นหาตำแหน่ง GPS...</p>

        <button id="ar-btn" class="btn" onclick="openAR()">กดเพื่อวางโมเดล AR</button>
    </div>

    <model-viewer id="my-model" src="./assets/robot.glb" ios-src="./assets/robot.usdz" ar
        ar-modes="webxr scene-viewer quick-look" camera-controls autoplay shadow-intensity="1">
    </model-viewer>

    <script>
        // 1. กำหนดพิกัดสถานที่เป้าหมาย (Latitude, Longitude)
        const targetLat = 12.6529929; // เปลี่ยนเป็นพิกัดสถานที่ของคุณ
        const targetLng = 99.8646328; // เปลี่ยนเป็นพิกัดสถานที่ของคุณ
        const maxDistance = 500; // กำหนดรัศมีที่อนุญาตให้เล่นได้ (หน่วย: เมตร)

        const messageEl = document.getElementById('message');
        const arBtn = document.getElementById('ar-btn');

        // 2. ฟังก์ชันคำนวณระยะทางระหว่างจุด 2 จุด (Haversine formula)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // รัศมีโลก (เมตร)
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; // คืนค่าเป็นเมตร
        }

        // 3. เริ่มขอตำแหน่งผู้ใช้
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {
                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;

                const distance = calculateDistance(userLat, userLng, targetLat, targetLng);

                if (distance <= maxDistance) {
                    messageEl.innerHTML = `✅ คุณอยู่ในพื้นที่แล้ว!<br>(ห่างจากจุดเป้าหมาย ${Math.round(distance)} เมตร)`;
                    arBtn.style.display = 'block'; // แสดงปุ่ม AR
                } else {
                    messageEl.innerHTML = `❌ คุณอยู่ไกลเกินไป<br>กรุณาเดินไปที่จุดเป้าหมาย<br>(ระยะทางปัจจุบัน ${Math.round(distance)} เมตร)`;
                }
            }, (error) => {
                messageEl.innerHTML = "⚠️ กรุณาอนุญาตให้เว็บไซต์เข้าถึงตำแหน่ง GPS ของคุณ";
            });
        } else {
            messageEl.innerHTML = "เบราว์เซอร์ของคุณไม่รองรับ GPS";
        }

        // 4. ฟังก์ชันสำหรับเปิด AR
        function openAR() {
            const modelViewer = document.getElementById('my-model');
            modelViewer.activateAR(); // สั่งให้เปิดโหมด AR สแกนพื้นทันที
        }
    </script>

</body>

</html>

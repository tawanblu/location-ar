<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ganesha AR - 1km Radius</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Kanit', sans-serif;
      background: #eef2f3;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #status-box {
      background: white;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      width: 85%;
      max-width: 400px;
      z-index: 10;
    }

    .btn {
      background: linear-gradient(135deg, #ff9966, #ff5e62);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 18px;
      margin-top: 20px;
      cursor: pointer;
      display: none; /* จะแสดงเมื่อเข้าระยะ 1000 เมตร */
      width: 100%;
      font-weight: bold;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(255, 94, 98, 0.4);
    }

    .btn:active { transform: scale(0.98); }

    .distance-info {
      font-size: 28px;
      font-weight: bold;
      color: #ff5e62;
      margin: 10px 0;
    }

    #message {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    model-viewer { display: none; }
  </style>
</head>

<body>

  <div id="status-box">
    <h2 style="margin-top:0; color: #ff5e62;">🕉️ Ganesha AR</h2>
    <p id="message">ระบบกำลังคำนวณระยะทางจาก GPS...</p>
    <div id="distance-display" class="distance-info">--</div>
    <button id="ar-btn" class="btn" onclick="openAR()">✨ รับพรพระพิฆเนศ (AR)</button>
  </div>

  <model-viewer id="my-model" 
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
    ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz" 
    ar ar-modes="webxr scene-viewer quick-look"
    camera-controls touch-action="pan-y">
  </model-viewer>

  <script>
    const messageEl = document.getElementById('message');
    const distanceEl = document.getElementById('distance-display');
    const arBtn = document.getElementById('ar-btn');

    // 🎯 ตั้งค่าพิกัดเป้าหมาย
    const TARGET_LAT = 13.7563; 
    const TARGET_LNG = 100.5018;
    const ACTIVATION_RADIUS = 1000; // ✅ ปรับเป็น 1000 เมตร (1 กิโลเมตร)

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (position) => {
          const { latitude, longitude } = position.coords;
          const distance = calculateDistance(latitude, longitude, TARGET_LAT, TARGET_LNG);

          // แสดงระยะทาง (ถ้าเกิน 1 กม. ให้โชว์เป็น km)
          if (distance >= 1000) {
            distanceEl.innerText = `${(distance / 1000).toFixed(2)} กม.`;
          } else {
            distanceEl.innerText = `${Math.round(distance)} ม.`;
          }

          // เงื่อนไขเปิดปุ่ม AR เมื่อระยะทางน้อยกว่าหรือเท่ากับ 1000 เมตร
          if (distance <= ACTIVATION_RADIUS) {
            messageEl.innerHTML = "<span style='color:green'><b>✅ เข้าสู่เขตมงคลแล้ว!</b><br>คุณสามารถอัญเชิญพระพิฆเนศได้แล้ว</span>";
            arBtn.style.display = 'block';
          } else {
            messageEl.innerHTML = `📍 กรุณาเดินทางเข้าใกล้จุดเป้าหมาย<br>ในรัศมี 1 กิโลเมตรเพื่อรับพร`;
            arBtn.style.display = 'none';
          }
        },
        (error) => {
          messageEl.innerHTML = "⚠️ โปรดเปิด GPS และอนุญาตสิทธิ์เข้าถึงตำแหน่ง";
        }, 
        { enableHighAccuracy: true }
      );
    } else {
      messageEl.innerHTML = "❌ อุปกรณ์ไม่รองรับ GPS";
    }

    function openAR() {
      const modelViewer = document.getElementById('my-model');
      if (modelViewer.canActivateAR) {
        modelViewer.activateAR();
      } else {
        alert("อุปกรณ์ของคุณไม่รองรับการแสดงผล AR");
      }
    }
  </script>
</body>
</html>

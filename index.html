<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Experience</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px 20px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        p {
            font-size: 14px;
            opacity: 0.8;
        }

        #distance {
            margin-top: 15px;
            font-size: 16px;
        }

        .status {
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.9;
        }

        #arButtonContainer {
            display: none;
            margin-top: 25px;
        }

        .ar-btn {
            display: inline-block;
            padding: 14px 25px;
            background: #00c6ff;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            font-size: 16px;
            border-radius: 50px;
            text-decoration: none;
            transition: 0.3s;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
        }

        .ar-btn:hover {
            transform: scale(1.05);
        }

        .ar-btn i {
            margin-right: 8px;
        }

        .pulse {
            margin-top: 20px;
            width: 15px;
            height: 15px;
            background: #00ffcc;
            border-radius: 50%;
            margin-left: auto;
            margin-right: auto;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            70% {
                transform: scale(2);
                opacity: 0;
            }

            100% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <h1><i class="fa-solid fa-location-dot"></i> AR Experience</h1>
        <p>เดินเข้าใกล้จุดเพื่อปลดล็อก AR</p>

        <div id="distance">กำลังตรวจสอบตำแหน่ง...</div>
        <div class="status" id="statusText">กำลังค้นหา GPS...</div>

        <div class="pulse"></div>

        <div id="arButtonContainer">
            <a id="arLink" href="#" class="ar-btn">
                <i class="fa-solid fa-cube"></i> เปิด AR
            </a>
        </div>
    </div>

    <script>
        // 📍 เปลี่ยนเป็นใช้ได้ทั้งประเทศไทย
        function isInThailand(lat, lng) {
            return lat >= 5.5 && lat <= 20.5 &&
                   lng >= 97.0 && lng <= 105.5;
        }

        const distanceText = document.getElementById("distance");
        const statusText = document.getElementById("statusText");
        const arButtonContainer = document.getElementById("arButtonContainer");
        const arLink = document.getElementById("arLink");

        // 🔗 AR Model
        const iosModelUrl = "https://modelviewer.dev/shared-assets/models/Astronaut.usdz";
        const androidModelDomainAndPath = "modelviewer.dev/shared-assets/models/Astronaut.glb";

        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const isAndroid = /Android/.test(navigator.userAgent);

        if (isIOS) {
            arLink.href = iosModelUrl;
            arLink.setAttribute("rel", "ar");
        } else if (isAndroid) {
            arLink.href = `intent://${androidModelDomainAndPath}#Intent;scheme=https;package=com.google.ar.core;end;`;
        }

        function checkLocation(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            distanceText.innerHTML = `📍 Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}`;

            if (isInThailand(lat, lng)) {
                statusText.innerHTML = "✅ คุณอยู่ในประเทศไทย";
                arButtonContainer.style.display = "block";
            } else {
                statusText.innerHTML = "❌ ใช้งานได้เฉพาะในประเทศไทย";
                arButtonContainer.style.display = "none";
            }
        }

        function error() {
            statusText.innerHTML = "⚠️ กรุณาเปิด GPS";
        }

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(checkLocation, error);
        } else {
            statusText.innerHTML = "❌ อุปกรณ์ไม่รองรับ GPS";
        }
    </script>

</body>

</html>

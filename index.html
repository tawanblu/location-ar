<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Geofence + Tap to Place</title>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #status-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 400px;
        }

        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
            display: none;
            width: 100%;
        }

        .btn:active {
            background: #0056b3;
        }

        /* ซ่อนตัว model-viewer ไว้ก่อน จนกว่าจะกดปุ่ม AR */
        model-viewer {
            width: 100%;
            height: 400px;
            display: none;
        }
    </style>
</head>

<body>

    <div id="status-box">
        <h3>📍 ตรวจสอบตำแหน่งของคุณ</h3>
        <p id="message">กำลังค้นหาตำแหน่ง GPS...</p>

        <button id="ar-btn" class="btn" onclick="openAR()">กดเพื่อวางโมเดล AR</button>
    </div>

    <model-viewer id="my-model" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
        ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz" ar
        ar-modes="webxr scene-viewer quick-look" camera-controls autoplay shadow-intensity="1">
    </model-viewer>

    <script>
        // อ้างอิง element เดิม
        const messageEl = document.getElementById('message');
        const arBtn = document.getElementById('ar-btn');

        // 📍 ฟังก์ชันเช็คว่าอยู่ในประเทศไทยไหม
        function isInThailand(lat, lng) {
            return lat >= 5.5 && lat <= 20.5 &&
                lng >= 97.0 && lng <= 105.5;
        }

        // เริ่มเช็คตำแหน่ง
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {

                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;

                if (isInThailand(userLat, userLng)) {
                    messageEl.innerHTML = `✅ คุณอยู่ในประเทศไทย<br>สามารถใช้งาน AR ได้`;
                    arBtn.style.display = 'block';
                } else {
                    messageEl.innerHTML = `❌ ระบบนี้ใช้ได้เฉพาะในประเทศไทย`;
                    arBtn.style.display = 'none';
                }

            }, (error) => {
                messageEl.innerHTML = "⚠️ กรุณาอนุญาตให้เข้าถึง GPS";
            });
        } else {
            messageEl.innerHTML = "❌ อุปกรณ์ไม่รองรับ GPS";
        }

        // 4. ฟังก์ชันสำหรับเปิด AR
        function openAR() {
            const modelViewer = document.getElementById('my-model');
            modelViewer.activateAR(); // สั่งให้เปิดโหมด AR สแกนพื้นทันที
        }
    </script>

</body>

</html>

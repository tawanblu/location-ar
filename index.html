<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR: Geofencing + Tap to Place</title>

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Prompt', sans-serif; /* ใช้ฟอนต์ใหม่ */
            background-color: #e5e5ea;
        }

        /* หน้าจอซ้อนทับแบบ Glassmorphism (กระจกฝ้า) */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4); /* พื้นหลังดำโปร่งแสง */
            backdrop-filter: blur(8px); /* เอฟเฟกต์เบลอ */
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* กล่องข้อความ UI */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 85%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h3 {
            margin: 0 0 10px 0;
            color: #1c1c1e;
            font-size: 1.3em;
        }

        #message {
            font-size: 1em;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* สไตล์ปุ่มกดที่ดูโมเดิร์นน่ากด */
        #ar-btn {
            background: linear-gradient(135deg, #007aff, #0056b3);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 1.1em;
            font-family: 'Prompt', sans-serif;
            font-weight: 600;
            cursor: pointer;
            display: none; /* ซ่อนไว้ก่อน */
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #ar-btn:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.3);
        }

        /* ให้ model-viewer อยู่ด้านหลังเต็มจอ */
        model-viewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>

<body>

    <div id="overlay">
        <div class="card">
            <h3>📍 ตรวจสอบตำแหน่ง</h3>
            <p id="message">กำลังค้นหาสัญญาณ GPS...</p>
            <button id="ar-btn" onclick="openAR()">🚀 เข้าสู่โหมด AR</button>
        </div>
    </div>

    <model-viewer id="my-model" 
        src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
        ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz" 
        ar
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        autoplay 
        shadow-intensity="1">
    </model-viewer>

    <script>
        // 1. กำหนดพิกัดสถานที่เป้าหมาย
        const targetLat = 12.6529929; 
        const targetLng = 99.8646328; 
        const maxDistance = 500; 

        const messageEl = document.getElementById('message');
        const arBtn = document.getElementById('ar-btn');
        const overlayEl = document.getElementById('overlay');

        // 2. ฟังก์ชันคำนวณระยะทาง
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; 
        }

        // 3. เริ่มขอตำแหน่งผู้ใช้
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {
                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;

                const distance = calculateDistance(userLat, userLng, targetLat, targetLng);

                if (distance <= maxDistance) {
                    messageEl.innerHTML = `<span style="color:#28a745; font-weight:bold;">✅ คุณอยู่ในพื้นที่แล้ว!</span><br>ห่างจากจุดเป้าหมาย ${Math.round(distance)} เมตร`;
                    arBtn.style.display = 'block'; 
                } else {
                    messageEl.innerHTML = `❌ คุณอยู่ไกลเกินไป<br>กรุณาเดินไปยังพื้นที่กิจกรรม<br>(ระยะทางปัจจุบัน ${Math.round(distance)} เมตร)`;
                }
            }, (error) => {
                messageEl.innerHTML = "⚠️ กรุณาอนุญาตให้เว็บไซต์เข้าถึง<br>ตำแหน่ง GPS ของคุณเพื่อเล่น AR";
            });
        } else {
            messageEl.innerHTML = "❌ เบราว์เซอร์ของคุณไม่รองรับ GPS";
        }

        // 4. ฟังก์ชันสำหรับเปิด AR
        function openAR() {
            // ซ่อนหน้าจอ Overlay ออกไป เพื่อให้เห็นโมเดลชัดๆ
            overlayEl.style.display = 'none';
            
            // สั่งเปิดโหมด AR
            const modelViewer = document.getElementById('my-model');
            modelViewer.activateAR(); 
        }
    </script>

</body>

</html>

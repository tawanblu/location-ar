<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ganesha AR - Open Anywhere</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap');

    body {
      margin: 0;
      font-family: 'Kanit', sans-serif;
      background: #fdf2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #status-box {
      background: white;
      padding: 30px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(255, 94, 98, 0.2);
      width: 85%;
      max-width: 400px;
      border: 2px solid #ff9966;
    }

    h2 {
      margin-top: 0;
      color: #ff5e62;
      font-size: 26px;
    }

    #message {
      color: #555;
      font-size: 16px;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .btn {
      background: linear-gradient(135deg, #ff9966, #ff5e62);
      color: white;
      border: none;
      padding: 18px;
      border-radius: 15px;
      font-size: 18px;
      cursor: pointer;
      width: 100%;
      font-weight: 700;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(255, 94, 98, 0.3);
    }

    .btn:active {
      transform: scale(0.96);
    }

    /* ซ่อนตัว Viewer หลัก */
    model-viewer {
      display: none;
    }
  </style>
</head>

<body>

  <div id="status-box">
    <h2>🕉️ Ganesha AR</h2>
    <div id="message">
      อัญเชิญพระพิฆเนศมาประทับตรงหน้า<br>
      เพื่อความเป็นสิริมงคลได้ทุกที่ทุกเวลา
    </div>

    <button id="ar-btn" class="btn" onclick="openAR()">✨ รับพรพระพิฆเนศ (AR)</button>
  </div>

  <model-viewer id="my-model"
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
    ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    touch-action="pan-y"
    alt="โมเดลพระพิฆเนศ">
  </model-viewer>

  <script>
    // ฟังก์ชันเรียกใช้งาน AR ทันทีเมื่อกดปุ่ม
    function openAR() {
      const modelViewer = document.getElementById('my-model');

      // ตรวจสอบว่าเบราว์เซอร์รองรับ AR หรือไม่
      if (modelViewer.canActivateAR) {
        modelViewer.activateAR();
      } else {
        alert("ขออภัย อุปกรณ์หรือเบราว์เซอร์ของคุณไม่รองรับการแสดงผล AR");
        // ในกรณีที่ไม่รองรับ AR อาจจะเปิดหน้าตัวอย่าง 3D แทน
        modelViewer.style.display = 'block';
        modelViewer.style.width = '100%';
        modelViewer.style.height = '300px';
        document.getElementById('status-box').style.display = 'none';
      }
    }
  </script>
</body>

</html>

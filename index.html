<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web AR</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 16px;
        }

        #arButtonContainer {
            /* เปลี่ยนเป็น block เพื่อให้ปุ่มแสดงทันที */
            display: block;
            margin-top: 40px;
        }

        .ar-btn {
            display: inline-block;
            padding: 15px 30px;
            background: #007bff;
            color: white;
            font-size: 18px;
            border-radius: 50px;
            text-decoration: none;
            transition: 0.3s;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .ar-btn:hover {
            background: #0056b3;
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }

        .ar-btn i {
            margin-right: 8px;
        }
    </style>
</head>

<body>

    <h1>สัมผัสประสบการณ์ AR</h1>
    <p>กดปุ่มด้านล่างเพื่อเปิดดูโมเดล 3 มิติในพื้นที่จริงของคุณ</p>

    <div id="arButtonContainer">
        <a id="arLink" href="#" class="ar-btn">
            <i class="fa-solid fa-cube"></i>
            รับชม AR
        </a>
    </div>

    <script>
        const arLink = document.getElementById("arLink");

        // --- ตั้งค่าลิงก์โมเดล ---
        // โมเดลสำหรับ iOS (.usdz)
        const iosModelUrl = "https://modelviewer.dev/shared-assets/models/Astronaut.usdz";

        // โมเดลสำหรับ Android (.glb) 
        const androidModelDomainAndPath = "modelviewer.dev/shared-assets/models/Astronaut.glb";
        // --------------------------------------------------------

        // ตรวจสอบระบบปฏิบัติการ
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isAndroid = /Android/.test(navigator.userAgent);

        // จัดเตรียมลิงก์ตาม OS
        if (isIOS) {
            arLink.href = iosModelUrl;
            arLink.setAttribute("rel", "ar");
        } else if (isAndroid) {
            arLink.href = `intent://${androidModelDomainAndPath}#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=https://developers.google.com/ar;end;`;
            arLink.removeAttribute("rel");
        } else {
            // หากเปิดบน PC
            arLink.href = "#";
            arLink.onclick = function (e) {
                e.preventDefault();
                alert("กรุณาเปิดหน้านี้บนสมาร์ทโฟน (iOS หรือ Android) เพื่อรับชม AR ครับ");
            };
        }
    </script>

</body>

</html>

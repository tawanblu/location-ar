<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Based AR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        #distance {
            font-size: 18px;
            margin-top: 10px;
        }

        #arButtonContainer {
            display: none;
            /* ซ่อนปุ่มไว้ก่อนจนกว่าจะถึงจุดที่กำหนด */
            margin-top: 30px;
        }

        .ar-btn {
            display: inline-block;
            padding: 15px 30px;
            background: #007bff;
            color: white;
            font-size: 18px;
            border-radius: 50px;
            text-decoration: none;
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }

        .ar-btn:hover {
            background: #0056b3;
        }

        .ar-btn i {
            margin-right: 8px;
        }
    </style>
</head>

<body>
    <h1>Location Based AR</h1>
    <p>เดินเข้าใกล้จุดที่กำหนดเพื่อเปิด AR</p>
    <div id="distance">กำลังตรวจสอบตำแหน่ง...</div>
    <div id="arButtonContainer"> 
        <a id="arLink" href="#" class="ar-btn"> 
            <i class="fa-solid fa-cube"></i> รับชม AR 
        </a>
    </div>

    <script> 
        // กำหนดตำแหน่งเป้าหมาย

        const targetLng = 99.864299;

        const distanceText = document.getElementById("distance"); 
        const arButtonContainer = document.getElementById("arButtonContainer"); 
        const arLink = document.getElementById("arLink");

        // โมเดลสำหรับ iOS (.usdz) ต้องใช้ URL เต็มๆ ที่มี https:// 
        const iosModelUrl = "https://modelviewer.dev/shared-assets/models/Astronaut.usdz"; 
        
        // โมเดลสำหรับ Android (.glb) ไม่ต้องใส่ https:// ไว้ข้างหน้า (เพราะจะถูกครอบด้วย Intent) 
        const androidModelDomainAndPath = "modelviewer.dev/shared-assets/models/Astronaut.glb"; 
        // -------------------------------------------------------- 
        
        // ตรวจสอบระบบปฏิบัติการ 
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; 
        const isAndroid = /Android/.test(navigator.userAgent); 
        
        // จัดเตรียมลิงก์ตาม OS 
        if (isIOS) { 
            arLink.href = iosModelUrl; 
            arLink.setAttribute("rel", "ar"); // จำเป็นสำหรับ iOS

            // โครงสร้าง Intent URL พิเศษสำหรับ Android ARCore
